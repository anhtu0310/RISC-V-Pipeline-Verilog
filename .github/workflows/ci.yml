name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator gcc-riscv64-unknown-elf

      - name: Lint RTL
        run: make lint

      - name: Rebuild test programs and check they match the committed images
        run: |
          make -B sw
          git diff --exit-code -- sw/build/*.hex

      - name: Run all tests
        run: make test SEEDS="$(seq 1 20 | tr '\n' ' ')"
